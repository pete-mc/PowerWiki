version: 2

updates:
  # Application dependencies. Grouped so a routine week is one PR rather than a
  # dozen — PowerWiki pins several large front-end libraries (Monaco, Mermaid,
  # React) whose patch releases are rarely interesting on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors stay ungrouped: renderer upgrades are deliberate, fixture-backed
    # changes (see agents.md), so they deserve their own PR and review.
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
