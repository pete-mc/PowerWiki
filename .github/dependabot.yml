version: 2

updates:
  # Application dependencies. Grouped so a routine week is one PR rather than a
  # dozen — PowerWiki pins several large front-end libraries (Monaco, Mermaid,
  # React) whose patch releases are rarely interesting on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        # For a 0.x package a "minor" bump is where breaking changes live, so
        # these must not ride in on a routine grouped PR — katex feeds the Word
        # export's native equations and monaco is the editor itself. Excluding
        # them means each arrives as its own reviewable PR.
        exclude-patterns:
          - katex
          - monaco-editor
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # @types/vscode must not be newer than vscode/package.json engines.vscode,
    # or src/vscode/ type-checks against APIs that supported VS Code builds lack
    # (tools/release/vscode-engine.mjs fails `npm test` if it is). Moving it is
    # a deliberate engine raise, done by hand together with the engine.
    ignore:
      - dependency-name: "@types/vscode"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    # Majors stay ungrouped: renderer upgrades are deliberate, fixture-backed
    # changes (see AGENTS.md), so they deserve their own PR and review.
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
