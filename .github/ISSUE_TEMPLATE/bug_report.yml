name: Bug report
description: Something in PowerWiki renders or behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a **security** issue, please don't file
        it here — use the
        [private advisory form](https://github.com/pete-mc/PowerWiki/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: markdown
    attributes:
      label: Markdown that reproduces it
      description: >
        For a rendering problem, the smallest page source that shows it. This is
        usually the single most useful thing in the report.
      render: markdown

  - type: input
    id: version
    attributes:
      label: PowerWiki version
      description: Shown next to the PowerWiki logo in the hub header, e.g. 1.3.4
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Azure DevOps host
      options:
        - Azure DevOps Services (dev.azure.com)
        - Azure DevOps Server (on-premises)
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Rendering issues are often theme-specific.
      options:
        - Light
        - Dark
        - Custom
        - Not theme-related / unsure

  - type: textarea
    id: comparison
    attributes:
      label: Does the built-in Azure DevOps Wiki do the same thing?
      description: >
        PowerWiki aims for parity with the built-in wiki, so knowing whether it
        differs there tells us whether this is a bug or an intentional
        difference. Skip if it doesn't apply.

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >
        Optional. Browser devtools console output, if any. Note PowerWiki runs
        in an iframe — select the extension frame in the console's frame picker.
      render: text
