name: Release (VS Code)

# Publishes the VS Code extension (`vscode/`) to the Visual Studio Marketplace.
#
# NOTE THE TAG PREFIX. `v*` belongs to the Azure DevOps hub extension and is
# wired to release.yml; tagging this one `v1.2.3` would publish *that* extension
# instead. The two extensions are separate listings with separate version
# histories, so they get separate tags:
#
#   v1.3.10        -> dataversepowertools.powerwiki         (Azure DevOps)
#   vscode-v0.1.1  -> dataversepowertools.powerwiki-vscode  (VS Code)
#
# `release.yml` matches `v[0-9]*`, not `v*`, precisely so that `vscode-v0.1.1`
# — which does start with a v — does not also fire it. Do not loosen that.
on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

jobs:
  release:
    name: Package, test, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the .vsix
    # Referencing an environment lets required reviewers be added later
    # (Settings -> Environments -> marketplace) so a tag alone cannot publish.
    environment: marketplace

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Marketplace refuses to republish a version, so an identity or
      # version mismatch has to fail before anything is uploaded — not after.
      - name: Verify the manifest matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#vscode-v}"
          echo "tag version: ${TAG%-pre}"
          node tools/release/assert-vscode-manifest.mjs "${TAG%-pre}"

      - name: Typecheck and unit tests
        run: npm test

      - name: Build the extension
        run: npm run build:vscode

      # The UI suite drives a real VS Code window, which needs a display. This is
      # the only gate that exercises the extension as a user meets it, so it runs
      # before publishing rather than being left to a later CI run.
      - name: UI tests
        run: xvfb-run -a node vscode/dist/test/runTests.js

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#vscode-v}"
          cd vscode
          npx @vscode/vsce package --no-dependencies \
            --out "../powerwiki-vscode-${VERSION%-pre}.vsix"

      # The channel is stated in the tag, not inferred from the version, so what
      # a tag does is readable from the tag:
      #
      #   vscode-v0.2.0-pre  -> pre-release, opt-in
      #   vscode-v0.2.0      -> the normal channel
      #
      # Deliberately not "0.x means pre-release": the pre-release channel is only
      # useful once a stable version exists to keep people on. For an extension
      # with no releases yet it would just mean nobody can install it the obvious
      # way. The version in vscode/package.json is plain semver either way —
      # the Marketplace will not take a prerelease identifier in it.
      - name: Decide the release channel
        id: channel
        run: |
          VERSION="${GITHUB_REF_NAME#vscode-v}"
          if [ "$VERSION" != "${VERSION%-pre}" ]; then
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
            echo "label=pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "label=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION%-pre}" >> "$GITHUB_OUTPUT"

      # Publish the exact artefact attached to the Release, so the downloadable
      # build and the Marketplace build are byte-identical.
      # Reuses ADO_MARKETPLACE_PAT: it is a Marketplace publisher token for this
      # publisher and already publishes a VS Code extension, so there is no
      # second secret to create. VSCE_PAT overrides it if a dedicated token is
      # ever preferred.
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.ADO_MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::No publisher token. Set ADO_MARKETPLACE_PAT (or VSCE_PAT) under"
            echo "::error::Settings -> Secrets and variables -> Actions. It must be scoped to"
            echo "::error::'All accessible organizations' — Marketplace APIs run outside any"
            echo "::error::organization context, and an org-scoped token 401s."
            exit 1
          fi
          echo "Publishing as ${{ steps.channel.outputs.label }}"
          npx @vscode/vsce publish ${{ steps.channel.outputs.flag }} \
            --no-dependencies \
            --packagePath "powerwiki-vscode-${{ steps.channel.outputs.version }}.vsix"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "powerwiki-vscode-${{ steps.channel.outputs.version }}.vsix" \
            --title "VS Code v${{ steps.channel.outputs.version }}" \
            --prerelease="${{ steps.channel.outputs.label == 'pre-release' }}" \
            --generate-notes
