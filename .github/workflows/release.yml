name: Release

# Tagging a version publishes it. The tag is the trigger, so the manifest
# versions must already match the tag (checked below before anything ships).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Package, release, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the .vsix
    # Referencing an environment lets you add required reviewers later
    # (Settings -> Environments -> marketplace) so a tag alone cannot publish.
    environment: marketplace

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # agents.md requires bumping the version in BOTH manifests. Forgetting one
      # is the classic slip, and the Marketplace refuses to republish a version,
      # so catch the mismatch before anything is uploaded.
      - name: Verify tag matches both manifests
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          MAN="$(node -p "require('./vss-extension.json').version")"
          echo "tag=$TAG package.json=$PKG vss-extension.json=$MAN"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MAN" ]; then
            echo "::error::Tag $TAG does not match package.json ($PKG) and vss-extension.json ($MAN)"
            exit 1
          fi

      - name: Typecheck and unit tests
        run: npm test

      - name: Build and package
        run: npm run package:vsix

      - name: Locate the .vsix
        id: vsix
        run: echo "path=$(ls dataversepowertools.powerwiki-*.vsix | head -1)" >> "$GITHUB_OUTPUT"

      # Publish the exact artifact that gets attached to the Release, so the
      # downloadable build and the Marketplace build are byte-identical.
      - name: Publish to the Visual Studio Marketplace
        env:
          TFX_TOKEN: ${{ secrets.ADO_MARKETPLACE_PAT }}
        run: |
          if [ -z "$TFX_TOKEN" ]; then
            echo "::error::ADO_MARKETPLACE_PAT is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx tfx-cli extension publish \
            --vsix "${{ steps.vsix.outputs.path }}" \
            --token "$TFX_TOKEN" \
            --no-wait-validation

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.vsix.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
