name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs tsc --noEmit followed by the Vitest unit tests.
      - name: Typecheck and unit tests
        run: npm test

      # Catches webpack/bundling breakage that the unit tests cannot see.
      - name: Build extension assets
        run: npm run build
