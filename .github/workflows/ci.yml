name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs tsc --noEmit followed by the Vitest unit tests.
      - name: Typecheck and unit tests
        run: npm test

      # Catches webpack/bundling breakage that the unit tests cannot see.
      - name: Build extension assets
        run: npm run build

      # Package the real artefact on every run. Previously the build output was
      # discarded, so manifest and packaging errors only surfaced at release time,
      # when a bad version number is already spent. This also gives a .vsix that
      # can be sideloaded into a test organisation from a pull request.
      - name: Package the extension
        run: npm run package:vsix

      - name: Upload the .vsix
        uses: actions/upload-artifact@v7
        with:
          name: powerwiki-vsix-${{ github.sha }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
